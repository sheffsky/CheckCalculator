apply plugin: 'com.android.application'

android {
    namespace 'ru.sheffsky.calculator'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "ru.sheffsky.calculator"
        minSdkVersion 14
        targetSdkVersion 35
        versionCode 10
        versionName "1.12"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

